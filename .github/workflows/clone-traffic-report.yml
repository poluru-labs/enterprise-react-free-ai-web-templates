name: Clone traffic report

on:
  schedule:
    # Roughly every 14 days: 1st and 15th of each month, 14:00 UTC
    - cron: '0 14 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clone-traffic-report
  cancel-in-progress: false

jobs:
  collect-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect clone and view traffic
        env:
          # Optional CLONE_STATS_TOKEN (PAT with repo access) if GITHUB_TOKEN cannot read traffic
          GITHUB_TOKEN: ${{ secrets.CLONE_STATS_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/collect-clone-stats.mjs

      - name: Commit and push stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .internal/clone-stats/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(analytics): update clone traffic report [skip ci]"
          git push
